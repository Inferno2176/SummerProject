name: Release macOS

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app
          npm run tauri build

      - name: Generate latest-darwin-x86_64.json
        shell: bash
        run: .github/scripts/build-latest-macos.sh
        env:
          GITHUB_EVENT_RELEASE_BODY: ${{ github.event.release.body }}
          GITHUB_EVENT_RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            latest-darwin-x86_64.json
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.app.tar.gz
            app/src-tauri/target/release/bundle/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
