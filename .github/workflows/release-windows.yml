name: Release Windows

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app
          npm run tauri build

      - name: Generate latest-windows-x86_64.json
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          $sigFile = Get-ChildItem -Path "app/src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Name -match '\.exe\.sig$|\.msi\.zip\.sig$' } |
            Select-Object -First 1

          if (-not $sigFile) {
            Write-Error "No Windows updater signature file found."
            exit 1
          }

          $updaterFile = Get-Item ($sigFile.FullName -replace '\.sig$', '')
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()

          $latestJson = @{
            version = $version
            notes = "${{ github.event.release.body }}"
            pub_date = "${{ github.event.release.published_at }}"
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/$($updaterFile.Name)"
              }
            }
          } | ConvertTo-Json -Depth 10

          $latestJson | Out-File -Path "latest-windows-x86_64.json" -Encoding utf8
          $latestJson | Out-File -Path "latest.json" -Encoding utf8

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            latest.json
            latest-windows-x86_64.json
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
