name: Build macOS (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.2)"
        required: true
        type: string

      upload_to_release:
        description: "Upload to release assets"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app
          npm run tauri build

      - name: Show Generated Bundle Files
        run: |
          find app/src-tauri/target/release/bundle -type f

      - name: Generate latest-darwin-x86_64.json
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.inputs.version }}
          GITHUB_EVENT_RELEASE_BODY: "Manual macOS build"
          GITHUB_EVENT_RELEASE_PUBLISHED_AT: ${{ github.event.repository.updated_at }}
        run: |
          chmod +x .github/scripts/build-latest-macos.sh
          .github/scripts/build-latest-macos.sh

      - name: Upload to Release (Optional)
        if: ${{ github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            latest-darwin-x86_64.json
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.app.tar.gz
            app/src-tauri/target/release/bundle/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            latest-darwin-x86_64.json
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.app.tar.gz
            app/src-tauri/target/release/bundle/**/*.sig