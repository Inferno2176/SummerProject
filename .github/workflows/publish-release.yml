name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            platform_key: windows-x86_64
            updater_glob: app/src-tauri/target/release/bundle/**/*.exe.sig
          - name: linux-x86_64
            os: ubuntu-22.04
            platform_key: linux-x86_64
            updater_glob: app/src-tauri/target/release/bundle/**/*.AppImage.tar.gz.sig
          - name: darwin-x86_64
            os: macos-13
            platform_key: darwin-x86_64
            updater_glob: app/src-tauri/target/release/bundle/**/*.app.tar.gz.sig

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app
          npm run tauri build

      - name: Prepare Release Files
        shell: pwsh
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
          UPDATER_GLOB: ${{ matrix.updater_glob }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $sigFile = Get-ChildItem -Path $env:UPDATER_GLOB -Recurse | Select-Object -First 1
          if (-not $sigFile) {
            Write-Error "No updater signature file found for $env:PLATFORM_KEY"
            exit 1
          }

          $updateFile = Get-Item ($sigFile.FullName -replace '\.sig$', '')
          if (-not $updateFile) {
            Write-Error "Could not locate updater bundle matching $($sigFile.FullName)"
            exit 1
          }

          Copy-Item $updateFile.FullName -Destination "release-assets/$($updateFile.Name)" -Force
          Copy-Item $sigFile.FullName -Destination "release-assets/$($sigFile.Name)" -Force

          # Upload primary installers too for direct download convenience.
          Get-ChildItem -Path "app/src-tauri/target/release/bundle" -Recurse -Include *.msi,*.exe,*.dmg,*.AppImage,*.deb |
            ForEach-Object {
              Copy-Item $_.FullName -Destination "release-assets/$($_.Name)" -Force
            }

          $metadata = @{
            platform = $env:PLATFORM_KEY
            updaterFile = $updateFile.Name
            signatureFile = $sigFile.Name
          } | ConvertTo-Json -Depth 5

          $metadata | Out-File -Path "release-assets/metadata-$($env:PLATFORM_KEY).json" -Encoding utf8

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform_key }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish Combined Assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Multi-Platform latest.json
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPOSITORY: ${{ github.repository }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          cat > generate-latest.js <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const dir = path.resolve("release-assets");
          const files = fs.readdirSync(dir);
          const metadataFiles = files.filter((f) => f.startsWith("metadata-") && f.endsWith(".json"));

          const platforms = {};
          for (const file of metadataFiles) {
            const meta = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8"));
            const sigPath = path.join(dir, meta.signatureFile);
            const sig = fs.readFileSync(sigPath, "utf8").trim();
            const url = `https://github.com/${process.env.REPOSITORY}/releases/download/${process.env.TAG_NAME}/${meta.updaterFile}`;

            platforms[meta.platform] = {
              signature: sig,
              url
            };
          }

          const version = process.env.TAG_NAME.replace(/^v/, "");
          const latest = {
            version,
            notes: process.env.RELEASE_BODY || "",
            pub_date: process.env.PUBLISHED_AT || new Date().toISOString(),
            platforms
          };

          fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2));
          EOF
          node generate-latest.js

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            latest.json
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}