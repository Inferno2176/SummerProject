name: Publish Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app
          npm run tauri build

      - name: Generate latest.json
        shell: pwsh
        run: |
          # Release version
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')

          # Find signature file
          $sigPath = Get-ChildItem -Path "app/src-tauri/target/release/bundle/nsis" -Filter "*.sig" | Select-Object -First 1

          if (-not $sigPath) {
            Write-Error "No .sig file found!"
            exit 1
          }

          $signature = Get-Content $sigPath.FullName -Raw

          # Create latest.json
          $latestJson = @{
              version = $version
              notes = "${{ github.event.release.body }}"
              pub_date = (Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                  "windows-x86_64" = @{
                      signature = $signature
                      url = "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/CareerForges_${version}_x64-setup.exe"
                  }
              }
          } | ConvertTo-Json -Depth 10

          # Save latest.json
          $latestJson | Out-File -Path "latest.json" -Encoding UTF8

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            latest.json
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}