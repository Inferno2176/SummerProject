[package]
name = "careerforges"
version = "0.1.6"
description = "Privacy-first local AI career operating system"
authors = ["Matta Joshi"]
license = "Proprietary"
repository = "https://github.com/JoshiNaidu/career-forges"
homepage = "https://careerforges.app"
documentation = "https://careerforges.app"
edition = "2021"

[lib]
name = "careerforges_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

sysinfo = "0.33"

reqwest = { 
  version = "0.12",
  features = ["json", "stream", "rustls-tls"],
  default-features = false
}

futures-util = "0.3"

# SQLite
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }

deadpool-sqlite = "0.8"

rusqlite_migration = "1"

tokio = { version = "1", features = ["full"] }

chrono = { version = "0.4", features = ["serde"] }

uuid = { version = "1.6", features = ["v4", "serde"] }

log = "0.4"
env_logger = "0.11"

anyhow = "1.0"
thiserror = "1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Add these under [dependencies]
pdf-extract = "0.7"
zip = "2.1"
